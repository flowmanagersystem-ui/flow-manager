<div class="screen">
    <div class="page-header">
        <div>
            <div class="page-title">{{ title }}</div>
            <div class="page-subtitle">{{ subtitle }}</div>
        </div>
        <button class="btn btn-primary" (click)="onAdd()">
            <mat-icon>add</mat-icon>
            Novo cliente
        </button>
    </div>
    <div class="table-wrap">
        <div class="table-toolbar">
            <div class="table-toolbar-search">
                <mat-icon class="icon-outlined search-icon" matPrefix>search</mat-icon>
                <input type="text" placeholder="Buscar por nome, e-mail, telefone..." autofocus                
                    #input 
                    matInput  
                    [formControl]="filtroControl"
                    (keyup)="applyFilter($event)"/>
            </div>

            <span class="badge badge-info">{{ totalElements }} {{ totalElements == 1 ? info : info + 's' }}</span>

            <table class="tbl" mat-table [dataSource]="dataSource" matSort>
                <ng-container matColumnDef="nome">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Nome </th>
                    <td class="tbl-item" mat-cell *matCellDef="let cliente"> <strong>{{ cliente.nome }} {{ cliente.sobrenome }}</strong> </td>
                </ng-container>

                <ng-container matColumnDef="email">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> E-mail </th>
                    <td class="tbl-item" mat-cell *matCellDef="let cliente">
                        <a [href]="'mailto:' + cliente.email">
                            {{ cliente.email }}
                        </a>
                    </td>
                </ng-container>

                <ng-container matColumnDef="telefone">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Telefone </th>
                    <td class="tbl-item" mat-cell *matCellDef="let cliente">
                        <a [href]="'tel:' + cliente.telefone">
                            {{ cliente.telefone }}
                        </a>
                    </td>
                </ng-container>

                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
                    <td class="tbl-item" mat-cell *matCellDef="let cliente">
                        <span class="badge" [ngClass]="{
                            'badge-success': cliente.status === 'Ativo',
                            'badge-gray': cliente.status === 'Inativo'
                        }">
                            {{ cliente.status }}
                        </span>
                    </td>
                </ng-container>

                <ng-container matColumnDef="actions">
                    <th mat-header-cell style="text-align: center;" *matHeaderCellDef> Ações </th>
                    <td mat-cell *matCellDef="let  cliente">
                        <div class="tbl-actions">
                            <button class="btn-icon" (click)="onEdit(cliente)">
                                <mat-icon class="icon-outlined">edit</mat-icon>
                            </button>
                            <button class="btn-icon" (click)="onRemove(cliente)">
                                <mat-icon class="icon-outlined">delete</mat-icon>
                            </button>
                        </div>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell lista-vazia" colspan="4" *ngIf="input.value == '' && dataSource.filteredData.length == 0">
                    {{ listaVazia }}
                    </td>
                    <td class="mat-cell filtro-nao-encontrado" colspan="4" *ngIf="input.value.length > 0">
                    {{ noResults }}  <strong>{{ input.value }}</strong>.
                    </td>
                </tr> 
            </table>
        </div>
        <mat-paginator class="pagination" aria-label="Navegação da tabela"
            [length]="totalElements" 
            [pageSize]="10" 
            [pageIndex]="paginaAtual"
            (page)="pageChange.emit($event)">
        </mat-paginator>
    </div>
</div>
