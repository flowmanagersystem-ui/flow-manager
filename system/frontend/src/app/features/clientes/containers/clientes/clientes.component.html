<app-clientes-list
  *ngIf="clientes$ | async as clientes; else loading" [clientes]="clientes"
  [totalElements]="totalElements"
  [paginaAtual]="paginaAtual"
  (pageChange)="onPageChange($event)"
  (add)="onAdd()"
  (edit)="onEdit($event)"
  (remove)="onRemove($event)">
</app-clientes-list>

<mat-card>

  <ng-template #loading>
    <div class="loading-spinner">
      <mat-spinner></mat-spinner>
    </div>
  </ng-template>

</mat-card>
