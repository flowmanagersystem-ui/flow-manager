<mat-card class="card" appearance="outlined">
    <mat-card-content>
        <form [formGroup]="formulario">
            <div class="form-row">               
                
                <mat-form-field class="form-group" appearance="outline">
                    <mat-label class="form-label">Cliente</mat-label>
                    <mat-select formControlName="cliente" placeholder="Selecione o cliente">
                        <mat-option *ngFor="let cliente of clientes$ | async" [value]="cliente">
                            {{ cliente.nome }} {{ cliente.sobrenome }}
                        </mat-option>
                    </mat-select>
                    <mat-error class="input-message" [control]="$any(formulario.get('cliente'))" [label]="'cliente'"></mat-error>                    
                </mat-form-field> 

            </div>

            <div class="form-row">
                <button class="btn btn-full" matButton="filled" (click)="onAddServices()">
                    <mat-icon>add</mat-icon>    
                    adicionar serviço
                </button>
            </div>
            
            <div class="servicos-lista" *ngIf="servicosAdicionados.length > 0">
                <div class="servico-item-card" *ngFor="let s of servicosAdicionados; let i = index">
                    <div class="servico-item-info">
                    <span class="servico-item-nome">{{ s.nomeServico }}</span>
                    <span class="servico-item-meta">
                        {{ s.nomeProfissional }} · {{ s.diaSemana }} às {{ s.horario }}
                    </span>
                    </div>
                    <div class="servico-item-right">
                    <span class="servico-item-valor">{{ textToCurrency(s.valorServico) }}</span>
                    <button class="btn-icon" (click)="removerServico(i)">
                        <mat-icon class="icon-outlined">delete</mat-icon> 
                    </button>
                    </div>
                </div>
            </div>

            <div class="resumo" *ngIf="servicosAdicionados.length > 0">
                <div class="resumo-row">
                    <span>Subtotal</span>
                    <div class="resumo-valores">
                        <span *ngFor="let servico of servicosAdicionados">
                            {{ textToCurrency(servico.valorServico) }}
                        </span>
                    </div>
                </div>
                <div class="resumo-total">
                    <span>Total</span>
                    <span>{{ textToCurrency(valorTotal) }}</span>
                </div>
            </div>
       
            <div class="form-row desconto-observacao" *ngIf="servicosAdicionados.length > 0">
                <mat-form-field appearance="outline">
                    <mat-label>Desconto (R$)</mat-label>
                    <input matInput type="number" formControlName="desconto" min="0" />
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Observação</mat-label>
                    <input matInput formControlName="observacao" />
                </mat-form-field>
            </div>
        </form>

    </mat-card-content>
    <mat-card-actions class="form-actions">
        <button class="btn btn-cancel" matButton="filled" (click)="onCancel()">Cancelar</button>
        <button class="btn btn-confirm" matButton="filled" (click)="onSubmit()">Confirmar Agendamento</button>
    </mat-card-actions>
</mat-card>
