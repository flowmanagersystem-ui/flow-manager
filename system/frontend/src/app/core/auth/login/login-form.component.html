<div class="login-page">
  <section class="login-panel">
    <div class="brand">
      <div class="logo-icon">
        <img src="assets/dark-logo.svg" alt="Flow Manager">
      </div>
      <div>
        <h1>Flow Manager</h1>
        <p>Acesse sua agenda e seus atendimentos</p>
      </div>
    </div>

    <form [formGroup]="formulario" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <mat-icon class="icon-outlined" matPrefix>mail</mat-icon>
        <input matInput type="email" formControlName="email" autocomplete="email">
        <mat-error *ngIf="formulario.get('email')?.hasError('required')">Informe o email</mat-error>
        <mat-error *ngIf="formulario.get('email')?.hasError('email')">Email inválido</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>
        <mat-icon class="icon-outlined" matPrefix>lock</mat-icon>
        <input matInput [type]="senhaVisivel ? 'text' : 'password'" formControlName="senha" autocomplete="current-password">
        <button mat-icon-button matSuffix type="button" (click)="toggleSenhaVisivel()">
          <mat-icon class="icon-outlined">{{ senhaVisivel ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error>Informe a senha</mat-error>
      </mat-form-field>

      <button mat-flat-button color="primary" type="submit" [disabled]="carregando">
        <mat-icon class="icon-outlined">login</mat-icon>
        <span>{{ carregando ? 'Entrando...' : 'Entrar' }}</span>
      </button>
    </form>
  </section>
</div>
