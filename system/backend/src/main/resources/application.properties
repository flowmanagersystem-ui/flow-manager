spring.application.name=flow-manager

spring.profiles.active=dev

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

security.jwt.secret=${JWT_SECRET:flow-manager-dev-secret-key-with-at-least-32-chars}
security.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION:900000}
security.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}
